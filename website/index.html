<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahalaxmi Electricals - Catalogues</title>
    <style>
      body {
          font-family: Arial, sans-serif;

          margin: 0;
          padding: 0;
          background-color: #f0f0f0;
          text-align: center;
      }
      .header {
          background-color: #fff;
          padding: 10px 0;
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .logo {
          height: 50px;
          margin-right: 20px;
      }
      .nav a {
          margin: 0 15px;
          text-decoration: none;
          color: #000;
          font-weight: bold;
      }
      .content {
          margin-top: 20px;
      }
      .catalogues h1 {
          font-size: 2em;
          border-bottom: 2px solid #000;
          display: inline-block;
          padding-bottom: 5px;
      }
      .catalogue-item {
          margin: 20px auto;
          width: 300px;
          border: 1px solid #ccc;
          padding: 10px;
      }
      .catalogue-item img {
          max-width: 100%;
          height: auto;
      }
      .catalogue-item button {
          background-color: #003087;
          color: #fff;
          border: none;
          padding: 10px 20px;
          cursor: pointer;
      }
      .contact-btn {
          background-color: #1da1f2;
          color: #fff;
          border: none;
          padding: 10px 20px;
          cursor: pointer;
          border-radius: 20px;
          margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="https://via.placeholder.com/150?text=Mahalaxmi+Electricals"
        alt="Mahalaxmi Electricals Logo"
        class="logo"
      />
      <div class="nav">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">WHY US</a>
        <a href="#">OUR BRANDS</a>
        <a href="#">PRICELIST</a>
        <a href="#">CERTIFICATES</a>
        <a href="#">TESTIMONIALS</a>
        <a href="#">CONTACT</a>
      </div>
    </div>
    <div class="content">
      <div class="catalogues">
        <h1>CATALOGUES</h1>
        <div class="catalogue-item">
          <img
            src="https://via.placeholder.com/300x200?text=Smart+Is+In+the+Range"
            alt="L&T Catalogue"
          />
          <button>L&T</button>
        </div>
      </div>
      <button class="contact-btn">Contact us</button>
    </div>
  </body>
</html>
