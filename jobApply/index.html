<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <div id="links">
      <div><a href="index.html">Home</a></div>
      <div><a href="appled.html ">Applied Jobs</a></div>
      <div><a href="bookmark.html">Bookmark</a></div>
    </div>
    <form id="form">
      <h2>Enter Your Application Details</h2>
      <input placeholder="Enter Your Name" id="Name" type="text" />
      <input placeholder="Enter Your Email" id="email" type="email" />
      <select id="role">
        <option value="FDS">FSD</option>
        
        <option value="Backend">Backend</option>
        <option value="Frontend">Frontend</option>
      </select>
      <input
        id="salary"
        type="number"
        placeholder="Enter Expected salary in LPA "
      />
      <input type="submit" id="submit" value="submit" />
    </form>
  </body>
  <script>
    // You Need to Code Here
    document.querySelector("#form").addEventListener("submit",jobSubmit)
        var jobArr=[]

    function jobSubmit(){
         event.preventDefault();

        var jobObj={
            personName: document.querySelector("#name").value,
          personEmail: document.querySelector("#email").value,
          personRole: document.querySelector("#role").value,
          personSalary: document.querySelector("#salary").value,
        };
        jobArr.push(jobObj);
        console.log(jobArr);
        localStorage.setItem("jobList",JSON.stringify(jobArr))
    }
  </script>
</html>
